name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Чистая база на каждый запуск: на ней проверяем, что миграции накатываются.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: matchday
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/matchday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Накатить миграции на чистую базу
        working-directory: backend
        run: alembic upgrade head
      - name: Проверить, что миграции совпадают с моделями
        working-directory: backend
        # Падает, если модель поменяли, а миграцию создать забыли.
        run: alembic check
      - name: Проверить, что миграции откатываются
        working-directory: backend
        run: alembic downgrade base && alembic upgrade head
      - name: Запустить тесты
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установить зависимости
        working-directory: frontend
        run: npm ci
      - name: Собрать проект
        working-directory: frontend
        run: npm run build
